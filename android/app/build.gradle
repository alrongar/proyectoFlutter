plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" version '4.3.15' apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

android {
    namespace = "com.example.eventify_flutter"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.eventify_flutter"
        minSdk = 23 // Asegúrate de que sea al menos 23 para Firebase Auth
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Configuración de firma para release
        }
    }
}

dependencies {
    // Desugaring para compatibilidad con APIs modernas
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    // Importar la BoM (Bill of Materials) de Firebase
    implementation platform("com.google.firebase:firebase-bom:33.8.0")

    // Dependencias de Firebase
    implementation "com.google.firebase:firebase-analytics" // Firebase Analytics
    implementation "com.google.firebase:firebase-messaging" // Firebase Cloud Messaging (FCM)
    implementation "com.google.firebase:firebase-firestore" // Firebase Firestore
    implementation "com.google.firebase:firebase-auth" // Firebase Authentication

    // Otras dependencias de Firebase que puedas necesitar
    // https://firebase.google.com/docs/android/setup#available-libraries
}

flutter {
    source = "../.."
}

// Aplicar el plugin de Google Services al final del archivo
apply plugin: 'com.google.gms.google-services'